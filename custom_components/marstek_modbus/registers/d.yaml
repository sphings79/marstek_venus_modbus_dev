BITFIELD_TEXT_SENSOR_DEFINITIONS:
    fault_status_description:
        key: fault_status_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status
        bit_descriptions:
            4: BMS offline / Battery disconnected
            5: BMS reports a fault (check pack firmware versions)
    fault_status_low_description:
        key: fault_status_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status_low
        bit_descriptions:
            6: Seen during DC discharge (unconfirmed)
            7: Backup / off-grid branch cannot operate (overload, too little energy, no battery)
            9: Seen during DC discharge (unconfirmed)
    fault_status_2_description:
        key: fault_status_2_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: fault_status_2
        bit_descriptions:
            0: Self-test failed
    fault_status_2_low_description:
        key: fault_status_2_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: fault_status_2_low
        bit_descriptions:
            0: Hardware protection latch B
            1: Hardware protection latch A
            3: Hardware protection latch C
            4: Hardware protection triggered
            7: Shut down by supervisor, retry after 60 s
            9: Supervisor fault (low confidence)
            11: Limit exceeded for more than 3000 cycles

GRID_POWER_SENSOR_DEFINITIONS:
    grid_power:
        key: grid_power
        unit: W
        device_class: power
        state_class: measurement
        precision: 0
        icon: "mdi:transmission-tower"
        enabled_by_default: false
        # Rebuilt from the formula the firmware uses for its Bluetooth payload
        # (FUN_0800b024, offset 0x90). No register carries this value.
        # Positive = export to grid, negative = import.
        dependency_keys:
            grid: ac_power
            offgrid: ac_offgrid_power
            state: inverter_state

BMS_POWER_SENSOR_DEFINITIONS:
    battery_power_bms:
        key: battery_power_bms
        unit: W
        device_class: power
        state_class: measurement
        precision: 0
        icon: "mdi:battery-sync-outline"
        enabled_by_default: false
        # Reproduces the firmware's own Bluetooth value (FUN_0800b024, offset 0x8C):
        # BMS pack voltage times pack current. The device discharges one pack at a
        # time, so the inactive packs contribute zero to the sum.
        dependency_keys:
            voltage: bms_battery_voltage
            p1: battery_current
            p2: battery_2_current
            p3: battery_3_current
            p4: battery_4_current
            p5: battery_5_current
            p6: battery_6_current

# ---------------------------------------------------------------------------
# DEV_UNKNOWN_SENSOR_DEFINITIONS — Option 'DEV-Register: unbekannt'
#
# Register, deren Bedeutung nicht geklaert ist. Zwei Quellen:
#   1. Konfidenz 'niedrig' oder 'mittel' im FW-Debug-Projekt, in keiner
#      regulaeren Sektion vorhanden.
#   2. Register >= 40000, die im Live-Scan vom 2026-08-22 nachweislich auf
#      einen FC03-Read geantwortet haben.
#
# Namensschema: 'DEV <register> (<verdacht>?)'. Das Fragezeichen macht deutlich,
# dass der Name eine Vermutung ist. Alle DEV-Entitaeten beginnen mit 'DEV' und
# stehen dadurch in der Oberflaeche beieinander.
#
# Bewusst NICHT enthalten:
#   - 41500-41515: WLAN-Zugangsdaten-Puffer. Der Wert wuerde sonst in Datenbank,
#     Backups und moeglicherweise Logs landen. Siehe FW-Debug-Projekt,
#     security/WLAN_Credentials_ueber_Modbus_41500.md
#   - alle Register, die im Scan die Verbindung haben abreissen lassen
#     (40000, 41000, 45000-45031, 46000).
# ---------------------------------------------------------------------------
