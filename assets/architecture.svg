<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" role="img" aria-label="How the integration reaches a Marstek Venus battery">
  <rect width="1160" height="400" rx="16" fill="#0B1B2B"/>
  <text x="34" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6E6E6E">One TCP connection, batched register reads — everything stays on your network</text>
  <rect x="40" y="96" width="250" height="176" rx="14" fill="#16344C" stroke="#1E4460" stroke-width="1"/>
  <rect x="40" y="96" width="250" height="4" rx="2" fill="#3DDC97"/>
  <text x="60" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2F8FC">Marstek Venus</text>
  <text x="60" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">Venus A · D · E v1/v2 · E v3</text>
  <text x="60" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">Battery storage</text>
  <text x="60" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">RS485 port, or Ethernet</text>
  <text x="60" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">directly on A / D / E v3</text>
  <rect x="410" y="96" width="250" height="176" rx="14" fill="#16344C" stroke="#1E4460" stroke-width="1"/>
  <rect x="410" y="96" width="250" height="4" rx="2" fill="#F5A623"/>
  <text x="430" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2F8FC">Modbus gateway</text>
  <text x="430" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">Elfin EW11 · PUSR DR134</text>
  <text x="430" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">Waveshare RS485-to-RJ45</text>
  <text x="430" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">Not needed where the battery</text>
  <text x="430" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">speaks Modbus TCP itself</text>
  <path d="M290 184H410" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <path d="M399 178l9 6-9 6" stroke="#F5A623" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350.0" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#F5A623" text-anchor="middle">RS485</text>
  <text x="350.0" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#7A93A6" text-anchor="middle">Modbus RTU</text>
  <rect x="780" y="96" width="340" height="176" rx="14" fill="#16344C" stroke="#1E4460" stroke-width="1"/>
  <rect x="780" y="96" width="340" height="4" rx="2" fill="#41BDF5"/>
  <text x="800" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2F8FC">Home Assistant</text>
  <text x="800" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">This integration</text>
  <text x="800" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9FB6C6">Sensors · switches · numbers · selects</text>
  <text x="800" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">One socket, two polling classes,</text>
  <text x="800" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A93A6">adjacent registers read in one block</text>
  <path d="M660 184H780" stroke="#41BDF5" stroke-width="3" stroke-linecap="round"/>
  <path d="M769 178l9 6-9 6" stroke="#41BDF5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720.0" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#41BDF5" text-anchor="middle">Modbus TCP</text>
  <text x="720.0" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#7A93A6" text-anchor="middle">port 502</text>
  <rect x="40" y="306" width="1080" height="54" rx="10" fill="#41BDF5" fill-opacity="0.08"/>
  <text x="64" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8FD6F7">No cloud, no Marstek account, no MQTT broker — the integration talks to the gateway and nothing else.</text>
</svg>
